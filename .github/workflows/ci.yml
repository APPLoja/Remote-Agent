name: ci

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RemoteAgent.sln

      - name: Build
        run: dotnet build RemoteAgent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RemoteAgent.sln --configuration Release --no-build --verbosity normal
